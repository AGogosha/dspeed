name: distribute

on:
  workflow_dispatch:
  push:
    tags: "v*"
  release:
    types:
      - published

jobs:

  dist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build SDist and wheel
      run: pipx run build

    - uses: actions/upload-artifact@v7
      with:
        path: dist/*

    - name: Check metadata
      run: pipx run twine check dist/*
